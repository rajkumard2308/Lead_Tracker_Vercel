<style>

tom:5px}.lead-date,.lead-email{color:#64748b;font-size:11px}.lead-email{margin-top:6px;word-break:break-word}.field-label{font-size:9px;font-weight:800;color:#94a3b8;letter-spacing:.5px;margin-bottom:3px}.field-value{font-size:12px;color:#334155;margin-bottom:3px}.agent-name{font-size:12px;font-weight:650;color:#334155;margin-bottom:6px}.source-name{font-size:11px;color:#64748b}.booking-date{display:inline-block;margin-top:7px;padding:4px 7px;background:#ecfdf5;color:#047857;border-radius:6px;font-size:10px;font-weight:650}.followup-badge{display:inline-block;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:6px;padding:5px 8px;font-size:10px;font-weight:700;margin-bottom:7px}.remarks{font-size:11px;color:#64748b}.phone-line{display:flex;align-items:center;gap:6px;font-size:13px;color:#374151;white-space:nowrap}.copy-btn{border:1px solid #d1d5db;background:white;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px;color:#374151}.actions{display:flex;flex-direction:column;gap:7px}.actions select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px;background:#fff;font-size:12px}.follow-box{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:10px}.follow-box .field{min-width:0}.follow-box .field label{display:block;font-size:10px;font-weight:800;color:#64748b;margin-bottom:5px;line-height:1.2}.follow-box input,.follow-box select{width:100%;height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:8px 9px;background:#fff;color:#334155;font-size:11px}.status-update-btn{width:100%;margin-top:9px}.empty-board{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:50px 20px;text-align:center;margin-top:10px}.empty-icon{font-size:36px;margin-bottom:10px}.empty-title{font-size:16px;font-weight:700;color:#334155}.empty-text{color:#94a3b8;font-size:13px;margin-top:5px}.analytics-title{font-size:28px;font-weight:800;color:#172033;margin-top:15px}.analytics-subtitle{color:#64748b;font-size:13px;margin-bottom:20px}.insight-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.insight-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:15px;text-align:center}.insight-label{font-size:11px;color:#64748b;font-weight:650}.insight-number{font-size:28px;font-weight:800;color:#172033;margin-top:4px}.analytics-table-wrapper{width:100%;overflow-x:auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-top:10px}.analytics-table{width:100%;border-collapse:collapse;font-size:13px}.analytics-table th{background:#f8fafc;color:#64748b;text-align:left;padding:13px 15px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.analytics-table td{padding:14px 15px;border-top:1px solid #f1f5f9;color:#334155}.progress-container{width:120px;height:7px;background:#e2e8f0;border-radius:999px;display:inline-block;vertical-align:middle;margin-right:8px}.progress-bar{height:100%;background:#6366f1;border-radius:999px}.chart-grid{display:grid;grid-template-columns:1fr;gap:20px}.chart-card{background:#0e1117;border-radius:12px;overflow:hidden;border:1px solid #29313d;min-height:480px}.chart{width:100%;height:520px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal-backdrop.open{display:flex}.modal{width:min(850px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 20px 70px rgba(15,23,42,.28);padding:20px}.modal.small{width:min(500px,100%)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modal-title{font-size:20px;font-weight:800;color:#172033}.close{border:0;background:#f1f5f9;border-radius:8px;width:34px;height:34px;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid.three{grid-template-columns:repeat(3,1fr)}.full{grid-column:1/-1}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions .btn{flex:1}.alert{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:12px}.alert.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.alert.success{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.alert.warning{background:#fffbeb;color:#92400e;border:1px solid #fde68a}.bulk-summary{font-size:13px;color:#475569;margin:12px 0}.table-scroll{overflow:auto}.preview-table{border-collapse:collapse;width:100%;font-size:11px}.preview-table th,.preview-table td{padding:7px 8px;border:1px solid #e2e8f0;text-align:left;white-space:nowrap}.preview-table th{background:#f8fafc;color:#64748b}.footer{color:#94a3b8;font-size:11px;margin-top:22px}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #cbd5e1;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1100px){.dashboard{grid-template-columns:repeat(3,1fr)}.status-nav{grid-template-columns:repeat(4,1fr)}.lead-table-header,.lead-row{grid-template-columns:1.3fr 1.3fr 1.4fr 1.3fr 1.5fr 1.8fr}.filter-grid{grid-template-columns:1fr 1fr}.form-grid.three{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.main{padding:1.2rem 12px 2rem}.top-header{grid-template-columns:1fr 1fr}.top-header>div:first-child{grid-column:1/-1}.main-title{font-size:26px}.filter-grid,.filter-row,.form-grid,.form-grid.three{grid-template-columns:1fr}.filter-fields{grid-template-columns:1fr}.dashboard{grid-template-columns:repeat(2,1fr)}.status-nav{grid-template-columns:repeat(2,1fr)}.lead-table-header{display:none}.lead-row{display:block}.lead-row>div{margin-bottom:12px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions select,.follow-box{grid-column:1/-1}.insight-grid{grid-template-columns:repeat(2,1fr)}}

<body>
<div class="main">
  <div id="app"></div>
</div>

<div id="modalBackdrop" class="modal-backdrop"></div>

<script>
const STATUSES=["Follow up","Quotation Given","Converted","No Availability","Out of Budget","Ghosted","Not Interested"];
const AGENTS=["Shweta","Mayank","Punya"];

const SOURCES = [
  "Whatsapp Campaign",
  "Whatsapp business",
  "Broad Match Campaign",
  "Villa Campaign",
  "Google Campaign",
  "Lead Gen-Campaign",
  "Google Lead Gen-Campaign",
  "Eazotel",
  "Meta Park Cafe",
  "Meta EBC",
  "AiSensy",
  "Call",
  "Organic",
  "Custom"
];
const FOLLOW_UP_OPTIONS=Array.from({length:20},(_,i)=>`Follow up ${i+1}`);
const BOARD_STATUS_ORDER=["Quotation Given","Follow up","Converted","No Availability","Out of Budget","Ghosted","Not Interested"];
const STATUS_ICONS={"Follow up":"🟡","Quotation Given":"🔵","Converted":"🟢","No Availability":"⚪","Out of Budget":"🔴","Ghosted":"🟣","Not Interested":"⚫"};
const STATUS_COLORS={"Follow up":"#F59E0B","Quotation Given":"#3B82F6","Converted":"#22C55E","No Availability":"#06B6D4","Out of Budget":"#EF4444","Ghosted":"#A855F7","Not Interested":"#64748B"};
const CHART_BG="#0E1117",TEXT_COLOR="#F8FAFC",MUTED_TEXT="#CBD5E1",GRID_COLOR="#29313D";
const state={leads:[],loading:true,error:"",tab:"board",selectedStatus:"Quotation Given",filters:{search:"",status:"All Statuses",agent:"All Agents",source:"All Sources",leadDate:false,dateFrom:"",dateTo:"",followUp:false,followUpFrom:"",followUpCount:"All Follow-up Counts",stayDate:false,checkIn:"",checkOut:""},modal:null,editing:null,deleting:null,bulk:null};

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function parseDate(v){if(!v)return null; const s=String(v).trim(); if(!s)return null; let m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/); if(m){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000; if(d>0&&mo>0)return new Date(y,mo-1,d)} m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]); return null;}
function isoDate(v){const d=parseDate(v); if(!d)return ""; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function displayDate(v){const d=parseDate(v);return d?`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`:"";}
function inputDate(v){return isoDate(v)}
function normalizePhone(v){let d=String(v??"").replace(/\D/g,"");if(d.length===12&&d.startsWith("91"))d=d.slice(2);return d;}
function amount(v){const t=String(v??"").replace(/[₹,\s]/g,"").replace(/^INR/i,"");const n=parseFloat(t);return Number.isFinite(n)?n:0;}
function indianNumber(n){n=Math.round(Number(n)||0);let s=String(n);if(s.length<=3)return s;let last=s.slice(-3),r=s.slice(0,-3),parts=[];while(r.length>2){parts.unshift(r.slice(-2));r=r.slice(0,-2)}if(r)parts.unshift(r);return parts.join(',')+','+last;}
function revenue(v){return `₹${indianNumber(v)}`;}
function val(x){return x==null?"":String(x).trim();}
function todayIso(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function escapeAttr(v){return esc(v).replace(/`/g,'&#96;')}

async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||`Request failed (${r.status})`);return data;}
async function load(){state.loading=true;state.error="";render();try{const d=await api('/api/leads');state.leads=d.leads||[];}catch(e){state.error=e.message}finally{state.loading=false;render();}}
function filtered(){let a=[...state.leads],f=state.filters;const clean=x=>val(x).toLowerCase();if(clean(f.search)){const q=clean(f.search);a=a.filter(r=>[r.Name,r.Number,r.Email].some(x=>clean(x).includes(q)))}if(f.status!=="All Statuses")a=a.filter(r=>val(r.Status)===f.status);if(f.agent!=="All Agents")a=a.filter(r=>val(r.Agent)===f.agent);if(f.source!=="All Sources")a=a.filter(r=>val(r.Source)===f.source);if(f.leadDate){if(f.dateFrom&&f.dateTo&&f.dateFrom>f.dateTo)return [];if(f.dateFrom)a=a.filter(r=>{const d=isoDate(r.Date);return d&&d>=f.dateFrom});if(f.dateTo)a=a.filter(r=>{const d=isoDate(r.Date);return d&&d<=f.dateTo})}if(f.followUp){if(f.followUpFrom)a=a.filter(r=>isoDate(r['Last Follow Up'])===f.followUpFrom);if(f.followUpCount!=="All Follow-up Counts")a=a.filter(r=>val(r['Follow Up Count'])===f.followUpCount)}if(f.stayDate){if(!f.checkIn)return [];a=a.filter(r=>isoDate(r['Check In Date'])===f.checkIn);if(f.checkOut)a=a.filter(r=>isoDate(r['Check Out Date'])===f.checkOut)}return a;}
function dashboardHTML(df){const c=Object.fromEntries(STATUSES.map(s=>[s,df.filter(r=>val(r.Status)===s).length]));const total=df.length,converted=c.Converted||0;const rev=df.filter(r=>val(r.Status)==='Converted').reduce((s,r)=>s+amount(r['Total Amount']),0);return `<div class="dashboard"><div class="metric"><div class="metric-label">TOTAL LEADS</div><div class="metric-value">${total}</div></div><div class="metric"><div class="metric-label">QUOTATION GIVEN</div><div class="metric-value">${c['Quotation Given']}</div></div><div class="metric"><div class="metric-label">FOLLOW UP</div><div class="metric-value">${c['Follow up']}</div></div><div class="metric"><div class="metric-label">CONVERTED</div><div class="metric-value">${converted}</div></div><div class="metric"><div class="metric-label">NO AVAILABILITY</div><div class="metric-value">${c['No Availability']}</div></div></div><div class="dashboard"><div class="metric"><div class="metric-label">OUT OF BUDGET</div><div class="metric-value">${c['Out of Budget']}</div></div><div class="metric"><div class="metric-label">GHOSTED</div><div class="metric-value">${c.Ghosted}</div></div><div class="metric"><div class="metric-label">NOT INTERESTED</div><div class="metric-value">${c['Not Interested']}</div></div><div class="metric"><div class="metric-label">TOTAL REVENUE</div><div class="metric-value">${revenue(rev)}</div></div><div class="metric"><div class="metric-label">CONVERSION</div><div class="metric-value">${total?(converted/total*100).toFixed(1):'0.0'}%</div></div></div>`}
function selectOptions(arr,selected,all){return (all?[all]:[]).concat(arr).map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function filtersHTML(){const f=state.filters;return `<div class="filters"><div class="filter-grid"><div class="field"><label>SEARCH</label><input id="fSearch" value="${escapeAttr(f.search)}" placeholder="Search name, phone, email..."></div><div class="field"><label>STATUS</label><select id="fStatus">${selectOptions(STATUSES,f.status,'All Statuses')}</select></div><div class="field"><label>AGENT</label><select id="fAgent">${selectOptions(AGENTS,f.agent,'All Agents')}</select></div><div class="field"><label>SOURCE</label><select id="fSource">${selectOptions(SOURCES,f.source,'All Sources')}</select></div></div><div class="filter-row"><div class="filter-group"><label class="toggle-line"><input id="leadDateToggle" type="checkbox" ${f.leadDate?'checked':''}> Filter by Lead Date</label><div class="filter-fields"><div class="field"><label>FROM DATE</label><input id="dateFrom" type="date" value="${f.dateFrom}"></div><div class="field"><label>TO DATE</label><input id="dateTo" type="date" value="${f.dateTo}"></div></div></div><div class="filter-group"><label class="toggle-line"><input id="followToggle" type="checkbox" ${f.followUp?'checked':''}> Filter by Last Follow-up</label><div class="filter-fields"><div class="field"><label>LAST FOLLOW-UP FROM DATE</label><input id="followFrom" type="date" value="${f.followUpFrom}"></div><div class="field"><label>FOLLOW-UP COUNT</label><select id="followCount"><option>All Follow-up Counts</option>${FOLLOW_UP_OPTIONS.map(x=>`<option ${x===f.followUpCount?'selected':''}>${x}</option>`).join('')}</select></div></div></div><div class="filter-group"><label class="toggle-line"><input id="stayToggle" type="checkbox" ${f.stayDate?'checked':''}> Filter by Stay Date</label><div class="filter-fields"><div class="field"><label>CHECK-IN DATE</label><input id="checkInFilter" type="date" value="${f.checkIn}"></div><div class="field"><label>CHECK-OUT DATE (OPTIONAL)</label><input id="checkOutFilter" type="date" value="${f.checkOut}"></div></div></div></div></div>`}
function boardHTML(df){const selected=state.selectedStatus;let rows=df.filter(r=>val(r.Status)===selected).sort((a,b)=>(+b._sheet_row)-(+a._sheet_row));return `<div class="section-heading">Lead Conversion Board</div><div class="status-nav">${BOARD_STATUS_ORDER.map(s=>`<button class="status-btn ${s===selected?'active':''}" data-status="${escapeAttr(s)}">${STATUS_ICONS[s]||'•'} ${esc(s)} • ${df.filter(r=>val(r.Status)===s).length}</button>`).join('')}</div><div class="selected-status-header"><div><span class="selected-status-icon">${STATUS_ICONS[selected]||'•'}</span><span class="selected-status-title">${esc(selected)}</span></div><span class="selected-count">${rows.length} Leads</span></div>${rows.length?`<div class="lead-table-header"><div>CLIENT</div><div>PHONE</div><div>STAY DATES</div><div>AGENT / SOURCE</div><div>FOLLOW-UP</div><div>ACTIONS</div></div>${rows.map(leadCard).join('')}`:`<div class="empty-board"><div class="empty-icon">📭</div><div class="empty-title">No leads in this stage</div><div class="empty-text">Leads assigned to this pipeline stage will appear here.</div></div>`}`}
function leadCard(r){const row=Number(r._sheet_row),status=val(r.Status),follow=status==='Follow up';return `<div class="lead-row"><div><div class="lead-name">${esc(val(r.Name)||'Unnamed Lead')}</div><div class="lead-date">📅 ${esc(displayDate(r.Date))}</div>${val(r.Email)?`<div class="lead-email">✉️ ${esc(r.Email)}</div>`:''}${status==='Converted'?`<div style="font-weight:800;margin-top:5px">₹ ${amount(r['Total Amount']).toFixed(2)}</div>`:''}</div><div>${r.Number?`<div class="phone-line">📞 ${esc(r.Number)} <button class="copy-btn" data-copy="${escapeAttr(r.Number)}">📋 Copy</button></div>`:'<span class="lead-date">No phone</span>'}</div><div>${r['Check In Date']?`<div class="field-label">STAY</div><div class="field-value">📅 ${esc(displayDate(r['Check In Date']))}</div>${r['Check Out Date']?`<div class="field-value">→ ${esc(displayDate(r['Check Out Date']))}</div>`:''}`:'<div class="field-label">No stay dates</div>'}${r['Booking Confirmation Date']?`<div class="booking-date">✓ Booked ${esc(displayDate(r['Booking Confirmation Date']))}</div>`:''}</div><div><div class="field-label">AGENT</div><div class="agent-name">👤 ${esc(r.Agent)}</div><div class="source-name">🔗 ${esc(r.Source)}</div></div><div>${r['Follow Up Count']?`<div class="followup-badge">🔔 ${esc(r['Follow Up Count'])}</div>`:''}${r['Last Follow Up']?`<div class="field-label">LAST FOLLOW-UP</div><div class="field-value">${esc(displayDate(r['Last Follow Up']))}</div>`:''}${r.Remarks?`<div class="remarks">${esc(String(r.Remarks).length>70?String(r.Remarks).slice(0,70)+'...':r.Remarks)}</div>`:''}</div><div class="actions"><button class="btn" data-edit="${row}">✏️ Edit</button><button class="btn" data-delete="${row}">🗑️ Delete</button><select data-status-row="${row}" data-original-status="${escapeAttr(status)}" data-original-follow="${escapeAttr(val(r['Follow Up Count']))}" data-original-date="${escapeAttr(inputDate(r['Last Follow Up']))}">${STATUSES.map(s=>`<option value="${escapeAttr(s)}" ${s===status?'selected':''}>${esc(s)}</option>`).join('')}</select><div class="status-controls" data-status-controls="${row}" style="display:${follow?'block':'none'}"><div class="follow-box"><div class="field"><label>LAST FOLLOW-UP DONE ON</label><input data-follow-date="${row}" type="date" value="${inputDate(r['Last Follow Up'])}"></div><div class="field"><label>FOLLOW-UP COUNT</label><select data-follow-count="${row}"><option value="">Follow-up Count</option>${FOLLOW_UP_OPTIONS.slice(0,8).map(x=>`<option value="${escapeAttr(x)}" ${x===val(r['Follow Up Count'])?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div></div><button class="btn btn-primary status-update-btn" data-save-status="${row}" style="display:none">✓ Update</button></div></div>`}

function analyticsHTML(df){if(!df.length)return `<div class="analytics-empty">No data available for analytics.</div>`;const converted=df.filter(r=>val(r.Status)==='Converted').length,followups=df.filter(r=>val(r.Status)==='Follow up').length,ghosted=df.filter(r=>val(r.Status)==='Ghosted').length;return `<div class="analytics-title">📊 Agent Performance & Insights</div><div class="analytics-subtitle">Performance summary based on the currently selected filters.</div><div class="insight-grid"><div class="insight-card"><div class="insight-label">Total Leads</div><div class="insight-number">${df.length}</div></div><div class="insight-card"><div class="insight-label">Converted</div><div class="insight-number">${converted}</div></div><div class="insight-card"><div class="insight-label">Conversion Rate</div><div class="insight-number">${(converted/df.length*100).toFixed(1)}%</div></div><div class="insight-card"><div class="insight-label">Pending Follow-ups</div><div class="insight-number">${followups}</div></div></div><div class="divider"></div><h3>👥 Agent Performance</h3><div class="analytics-table-wrapper"><table class="analytics-table"><thead><tr><th>Agent</th><th>Total Leads</th><th>Converted</th><th>Follow Ups</th><th>Conversion</th><th>Total Revenue</th></tr></thead><tbody>${AGENTS.map(a=>{const x=df.filter(r=>val(r.Agent)===a),co=x.filter(r=>val(r.Status)==='Converted').length,fu=x.filter(r=>val(r.Status)==='Follow up').length,rv=x.reduce((s,r)=>s+(val(r.Status)==='Converted'?amount(r['Total Amount']):0),0),rate=x.length?co/x.length*100:0;return `<tr><td><b>👤 ${esc(a)}</b></td><td>${x.length}</td><td>${co}</td><td>${fu}</td><td><span class="progress-container"><span class="progress-bar" style="width:${Math.min(rate,100)}%"></span></span>${rate.toFixed(1)}%</td><td>${revenue(rv)}</td></tr>`}).join('')}</tbody></table></div><div class="divider"></div><h3>📌 Pipeline Status</h3><div class="insight-grid">${STATUSES.map(s=>`<div class="insight-card"><div class="insight-label">${esc(s)}</div><div class="insight-number">${df.filter(r=>val(r.Status)===s).length}</div></div>`).join('')}</div><div class="divider"></div><h3>🔗 Lead Sources</h3><div class="insight-grid">${Object.entries(countBy(df,'Source')).map(([s,n])=>`<div class="insight-card"><div class="insight-label">${esc(s||'Unknown')}</div><div class="insight-number">${n}</div></div>`).join('')}</div><div class="divider"></div><h3>🔔 Follow-up Insights</h3><div class="insight-grid">${FOLLOW_UP_OPTIONS.slice(0,8).map(s=>`<div class="insight-card"><div class="insight-label">${s}</div><div class="insight-number">${df.filter(r=>val(r['Follow Up Count'])===s).length}</div></div>`).join('')}</div>${ghosted?`<div class="alert warning">⚠️ ${ghosted} lead(s) are currently marked as Ghosted.</div>`:''}`}
function countBy(df,key){const out={};df.forEach(r=>{const k=val(r[key])||'Unknown';out[k]=(out[k]||0)+1});return out}
function chartHTML(){return `<div class="analytics-title">📈 Analytics</div><div class="analytics-subtitle">Visual performance and conversion trends based on the currently selected filters.</div><div class="chart-grid"><div class="chart-card"><div id="chartDate" class="chart"></div></div><div class="chart-card"><div id="chartAgent" class="chart"></div></div><div class="chart-card"><div id="chartRevenue" class="chart"></div></div><div class="chart-card"><div id="chartSource" class="chart"></div></div><div class="chart-card"><div id="chartFollow" class="chart"></div></div><div class="chart-card"><div id="chartConversion" class="chart"></div></div></div>`}
function baseLayout(title){return {title:{text:title,x:0,xanchor:'left',font:{size:20,color:TEXT_COLOR}},paper_bgcolor:CHART_BG,plot_bgcolor:CHART_BG,font:{color:TEXT_COLOR,size:12},height:520,margin:{l:70,r:30,t:90,b:80},hoverlabel:{bgcolor:'#111827',bordercolor:'#374151',font:{color:'#F9FAFB',size:12}},hovermode:'closest',legend:{font:{color:TEXT_COLOR,size:11}}};}
function drawCharts(df){if(!window.Plotly)return;const cfg={displaylogo:false,responsive:true,scrollZoom:false,modeBarButtonsToRemove:['select2d','lasso2d','autoScale2d','toggleSpikelines']};const dates=[...new Set(df.map(r=>isoDate(r.Date)).filter(Boolean))].sort();const dateLabels=dates.map(d=>displayDate(d));const traces=STATUSES.map(s=>({x:dateLabels,y:dates.map(d=>df.filter(r=>isoDate(r.Date)===d&&val(r.Status)===s).length),name:s,type:'bar',marker:{color:STATUS_COLORS[s]},hovertemplate:`<b>%{x}</b><br>${s}: <b>%{y}</b><extra></extra>`}));const totals=dates.map(d=>df.filter(r=>isoDate(r.Date)===d).length);const annotations=dateLabels.map((x,i)=>({x,y:totals[i],text:`<b>${totals[i]}</b>`,showarrow:false,yshift:10,font:{size:13,color:TEXT_COLOR}}));let l=baseLayout('Daily Lead Distribution');l.barmode='stack';l.bargap=.25;l.margin={l:75,r:30,t:115,b:95};l.legend={orientation:'h',yanchor:'bottom',y:1.02,xanchor:'left',x:0,font:{color:TEXT_COLOR,size:12},bgcolor:'rgba(0,0,0,0)'};l.xaxis={title:{text:'Lead Date',font:{color:TEXT_COLOR,size:13}},type:'category',tickangle:-30,tickfont:{color:MUTED_TEXT,size:11},showgrid:false,categoryorder:'array',categoryarray:dateLabels};l.yaxis={title:{text:'Number of Leads',font:{color:TEXT_COLOR,size:13}},gridcolor:GRID_COLOR,tickfont:{color:MUTED_TEXT,size:11},rangemode:'tozero'};l.annotations=annotations;Plotly.newPlot('chartDate',traces,l,cfg);
const agents=AGENTS;const agentVals=agents.map(a=>df.filter(r=>val(r.Agent)===a).length);let a=baseLayout('Number of Leads');a.xaxis={title:'Agent'};a.yaxis={title:'Number of Leads',gridcolor:GRID_COLOR};Plotly.newPlot('chartAgent',[{x:agents,y:agentVals,type:'bar',marker:{color:agents.map((_,i)=>['#6366F1','#14B8A6','#F59E0B'][i%3])},hovertemplate:'<b>%{x}</b><br>Leads: <b>%{y}</b><extra></extra>',text:agentVals,textposition:'outside',cliponaxis:false}],a,cfg);
const revVals=agents.map(x=>df.filter(r=>val(r.Agent)===x&&val(r.Status)==='Converted').reduce((s,r)=>s+amount(r['Total Amount']),0));let rv=baseLayout('Revenue');rv.xaxis={title:'Agent'};rv.yaxis={title:'Revenue',tickprefix:'₹',gridcolor:GRID_COLOR};Plotly.newPlot('chartRevenue',[{x:agents,y:revVals,type:'bar',marker:{color:agents.map((_,i)=>['#22C55E','#3B82F6','#A855F7'][i%3])},hovertemplate:'<b>%{x}</b><br>Revenue: <b>₹%{y:,.0f}</b><extra></extra>',text:revVals.map(x=>revenue(x)),textposition:'outside',cliponaxis:false}],rv,cfg);
const sources=Object.keys(countBy(df,'Source')),sourceVals=sources.map(s=>countBy(df,'Source')[s]);let sl=baseLayout('Source');sl.xaxis={title:'Source',tickangle:-25};sl.yaxis={title:'Number of Leads',gridcolor:GRID_COLOR};Plotly.newPlot('chartSource',[{x:sources,y:sourceVals,type:'bar',marker:{color:sources.map((_,i)=>['#3B82F6','#F59E0B','#22C55E','#A855F7','#06B6D4','#EF4444','#64748B'][i%7])},hovertemplate:'<b>%{x}</b><br>Leads: <b>%{y}</b><extra></extra>',text:sourceVals,textposition:'outside',cliponaxis:false}],sl,cfg);
const fu=FOLLOW_UP_OPTIONS.slice(0,8),fuVals=fu.map(x=>df.filter(r=>val(r['Follow Up Count'])===x).length);let fl=baseLayout('Follow-up');fl.xaxis={title:'Follow-up',tickangle:-30};fl.yaxis={title:'Number of Leads',gridcolor:GRID_COLOR};Plotly.newPlot('chartFollow',[{x:fu,y:fuVals,type:'bar',marker:{color:'#F59E0B'},hovertemplate:'<b>%{x}</b><br>Leads: <b>%{y}</b><extra></extra>',text:fuVals,textposition:'outside',cliponaxis:false}],fl,cfg);
const conv=agents.map(x=>{const all=df.filter(r=>val(r.Agent)===x),co=all.filter(r=>val(r.Status)==='Converted').length;return all.length?co/all.length*100:0});let cl=baseLayout('Conversion Rate');cl.xaxis={title:'Agent'};cl.yaxis={title:'Conversion Rate',ticksuffix:'%',gridcolor:GRID_COLOR,range:[0,Math.max(10,...conv)*1.2]};Plotly.newPlot('chartConversion',[{x:agents,y:conv,type:'bar',marker:{color:'#6366F1'},hovertemplate:'<b>%{x}</b><br>Conversion: <b>%{y:.1f}%</b><extra></extra>',text:conv.map(x=>x.toFixed(1)+'%'),textposition:'outside',cliponaxis:false}],cl,cfg);}

function render(){const root=document.getElementById('app');if(state.loading){root.innerHTML='<div style="padding:80px;text-align:center;color:#64748b"><span class="spinner"></span> Loading leads...</div>';return}const df=filtered();root.innerHTML=`<div class="top-header"><div><div class="main-title">📈 2026 Lead Conversion Board</div><div class="sub-title">Pipeline Tracking, Conversion Velocity & Follow-Up Management</div></div><div class="header-action"><button class="btn btn-primary" id="addBtn">➕ Add Lead</button></div><div class="header-action"><button class="btn" id="bulkBtn">📥 Bulk Add</button></div></div>${state.error?`<div class="alert error">${esc(state.error)}</div>`:''}<div class="toolbar"><button class="btn" id="refreshBtn">🔄 Refresh</button></div>${filtersHTML()}${state.filters.leadDate&&state.filters.dateFrom&&state.filters.dateTo?`<div style="font-size:12px;color:#64748b;margin:-6px 0 10px">📅 Showing leads from ${esc(displayDate(state.filters.dateFrom))} to ${esc(displayDate(state.filters.dateTo))}</div>`:''}${dashboardHTML(df)}<div class="divider"></div><div class="tabs"><button class="tab ${state.tab==='board'?'active':''}" data-tab="board">📋 Conversion Board</button><button class="tab ${state.tab==='analytics'?'active':''}" data-tab="analytics">📊 Agent Performance & Insights</button><button class="tab ${state.tab==='charts'?'active':''}" data-tab="charts">📈 Analytics</button></div><div class="panel ${state.tab==='board'?'active':''}" id="panelBoard">${boardHTML(df)}</div><div class="panel ${state.tab==='analytics'?'active':''}" id="panelAnalytics">${analyticsHTML(df)}</div><div class="panel ${state.tab==='charts'?'active':''}" id="panelCharts">${chartHTML()}</div><div class="footer">Showing ${df.length} of ${state.leads.length} leads • Google Sheets is the shared source of truth.</div>`;bind();if(state.tab==='charts')setTimeout(()=>drawCharts(df),0);}

function updateStatusControls(row){const select=document.querySelector(`[data-status-row="${row}"]`);const controls=document.querySelector(`[data-status-controls="${row}"]`);if(!select||!controls)return;const status=select.value;const originalFollow=select.dataset.originalFollow||'';const originalDate=select.dataset.originalDate||'';const currentDate=controls.querySelector(`[data-follow-date="${row}"]`)?.value||'';const currentCount=controls.querySelector(`[data-follow-count="${row}"]`)?.value||'';if(status==='Follow up'){controls.innerHTML=`<div class="follow-box"><div class="field"><label>LAST FOLLOW-UP DONE ON</label><input data-follow-date="${row}" type="date" value="${escapeAttr(currentDate||originalDate)}"></div><div class="field"><label>FOLLOW-UP COUNT</label><select data-follow-count="${row}"><option value="">Follow-up Count</option>${FOLLOW_UP_OPTIONS.slice(0,8).map(x=>`<option value="${escapeAttr(x)}" ${x===(currentCount||originalFollow)?'selected':''}>${x}</option>`).join('')}</select></div></div><button class="btn btn-primary status-update-btn" data-save-status="${row}">✓ Update</button>`;}else{controls.innerHTML=`<button class="btn btn-primary status-update-btn" data-save-status="${row}" style="display:none">✓ Update</button>`;}const btn=controls.querySelector(`[data-save-status="${row}"]`);if(btn)btn.onclick=()=>saveStatus(row);controls.querySelector(`[data-follow-date="${row}"]`)?.addEventListener('change',()=>checkStatusChanged(row));controls.querySelector(`[data-follow-count="${row}"]`)?.addEventListener('change',()=>checkStatusChanged(row));checkStatusChanged(row);}
function checkStatusChanged(row){const select=document.querySelector(`[data-status-row="${row}"]`);const controls=document.querySelector(`[data-status-controls="${row}"]`);if(!select||!controls)return;const selectedStatus=select.value;const originalStatus=select.dataset.originalStatus||'';const originalFollow=select.dataset.originalFollow||'';const originalDate=select.dataset.originalDate||'';const currentDate=controls.querySelector(`[data-follow-date="${row}"]`)?.value||'';const currentCount=controls.querySelector(`[data-follow-count="${row}"]`)?.value||'';let changed=selectedStatus!==originalStatus;if(selectedStatus==='Follow up'&&(currentDate!==originalDate||currentCount!==originalFollow))changed=true;const btn=controls.querySelector(`[data-save-status="${row}"]`);if(btn)btn.style.display=changed?'block':'none';}

function bind(){document.getElementById('addBtn')?.addEventListener('click',()=>openAdd());document.getElementById('bulkBtn')?.addEventListener('click',()=>openBulk());document.getElementById('refreshBtn')?.addEventListener('click',load);document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{state.tab=x.dataset.tab;render()});document.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>{state.selectedStatus=x.dataset.status;render()});document.getElementById('fSearch')?.addEventListener('input',e=>{state.filters.search=e.target.value;renderDebounced()});['fStatus','fAgent','fSource'].forEach(id=>document.getElementById(id)?.addEventListener('change',e=>{const map={fStatus:'status',fAgent:'agent',fSource:'source'};state.filters[map[id]]=e.target.value;render()}));document.getElementById('leadDateToggle')?.addEventListener('change',e=>{state.filters.leadDate=e.target.checked;render()});document.getElementById('followToggle')?.addEventListener('change',e=>{state.filters.followUp=e.target.checked;render()});document.getElementById('stayToggle')?.addEventListener('change',e=>{state.filters.stayDate=e.target.checked;render()});[['dateFrom','dateFrom'],['dateTo','dateTo'],['followFrom','followUpFrom'],['followCount','followUpCount'],['checkInFilter','checkIn'],['checkOutFilter','checkOut']].forEach(([id,k])=>document.getElementById(id)?.addEventListener('change',e=>{state.filters[k]=e.target.value;render()}));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);const old=b.textContent;b.textContent='✓ Copied';setTimeout(()=>b.textContent=old,1200)}catch{}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(+b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>openDelete(+b.dataset.delete));document.querySelectorAll('[data-status-row]').forEach(s=>{const row=+s.dataset.statusRow;const card=s.closest('.lead-row');const controls=card.querySelector(`[data-status-controls="${row}"]`);const btn=card.querySelector(`[data-save-status="${row}"]`);const dateInput=card.querySelector(`[data-follow-date="${row}"]`);const countInput=card.querySelector(`[data-follow-count="${row}"]`);const check=()=>{const st=s.value;const fd=dateInput?.value||'';const fc=countInput?.value||'';const isFollow=st==='Follow up';if(controls)controls.style.display=isFollow?'block':'none';const changed=st!==s.dataset.originalStatus||(isFollow&&(fd!==s.dataset.originalDate||fc!==s.dataset.originalFollow));if(btn)btn.style.display=changed?'block':'none'};s.addEventListener('change',check);dateInput?.addEventListener('change',check);countInput?.addEventListener('change',check);check()});document.querySelectorAll('[data-save-status]').forEach(b=>b.onclick=()=>saveStatus(+b.dataset.saveStatus));}

let renderTimer;function renderDebounced(){clearTimeout(renderTimer);renderTimer=setTimeout(render,250)}
async function saveStatus(row){const card=document.querySelector(`[data-save-status="${row}"]`).closest('.lead-row');const status=card.querySelector(`[data-status-row="${row}"]`).value;const updates={Status:status};if(status==='Follow up'){updates['Follow Up Count']=card.querySelector(`[data-follow-count="${row}"]`)?.value||'';updates['Last Follow Up']=card.querySelector(`[data-follow-date="${row}"]`)?.value?displayDate(card.querySelector(`[data-follow-date="${row}"]`).value):''}else{updates['Follow Up Count']='';updates['Last Follow Up']=''}try{await api(`/api/leads/${row}`,{method:'PUT',body:JSON.stringify(updates)});await load();showToast('Lead updated successfully.','success')}catch(e){showToast(e.message,'error')}}
function modal(content,cls=''){const b=document.getElementById('modalBackdrop');b.innerHTML=`<div class="modal ${cls}">${content}</div>`;b.classList.add('open');b.onclick=e=>{if(e.target===b)closeModal()};}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('modalBackdrop').innerHTML='';state.modal=null;state.editing=null;state.deleting=null;state.bulk=null}
function showToast(msg,type){const d=document.createElement('div');d.className=`alert ${type==='success'?'success':'error'}`;d.textContent=msg;Object.assign(d.style,{position:'fixed',right:'20px',top:'20px',zIndex:2000,boxShadow:'0 10px 30px rgba(15,23,42,.15)'});document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function formHTML(lead=null){const isEdit=!!lead;const r=lead||{};const custom=!SOURCES.includes(val(r.Source))&&val(r.Source);const source=custom?'Custom':(val(r.Source)||'Whatsapp business');const status=val(r.Status)||'Quotation Given';const amountVal=amount(r['Total Amount']);return `<div class="modal-head"><div class="modal-title">${isEdit?'✏️ Edit Lead':'➕ Add Lead'}</div><button class="close" id="closeModal">✕</button></div><div id="formError"></div><div class="form-grid"><div class="field"><label>Inquiry Date</label><input id="leadDate" type="date" value="${inputDate(r.Date)||todayIso()}"></div><div class="field"><label>Name</label><input id="leadName" value="${escapeAttr(r.Name)}"></div><div class="field"><label>Phone</label><input id="leadPhone" value="${escapeAttr(r.Number)}"></div><div class="field"><label>Email</label><input id="leadEmail" value="${escapeAttr(r.Email)}"></div><div class="field"><label>Check In Date</label><input id="leadCheckIn" type="date" value="${inputDate(r['Check In Date'])}"></div><div class="field"><label>Check Out Date</label><input id="leadCheckOut" type="date" value="${inputDate(r['Check Out Date'])}"></div><div class="field"><label>Agent</label><select id="leadAgent">${AGENTS.map(x=>`<option ${x===val(r.Agent)?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Pipeline Status</label><select id="leadStatus">${STATUSES.map(x=>`<option ${x===status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Lead Source</label><select id="leadSource">${SOURCES.map(x=>`<option ${x===source?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" id="customSourceWrap" style="display:${source==='Custom'?'block':'none'}"><label>Custom Source</label><input id="customSource" placeholder="e.g. Instagram, Facebook, Website..." value="${escapeAttr(custom||'')}"></div><div class="field"><label>Booking Confirmation Date</label><input id="leadBooking" type="date" value="${inputDate(r['Booking Confirmation Date'])}"></div><div class="field"><label>Last Follow-up Done On</label><input id="leadLastFollow" type="date" value="${inputDate(r['Last Follow Up'])}"></div><div class="field" id="followCountWrap"><label>Follow-up Count</label><select id="leadFollowCount"><option value=""></option>${FOLLOW_UP_OPTIONS.map(x=>`<option ${x===val(r['Follow Up Count'])?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Remarks</label><textarea id="leadRemarks" rows="3">${esc(r.Remarks)}</textarea></div><div class="field" id="amountWrap" style="display:${status==='Converted'?'block':'none'}"><label>Total Amount (₹)</label><input id="leadAmount" type="number" min="0" step="100" value="${amountVal||''}"></div></div><div class="modal-actions"><button class="btn btn-primary" id="saveLead">💾 ${isEdit?'Save Changes':'Add Lead'}</button><button class="btn" id="cancelLead">Cancel</button></div>`}
function syncForm(){const status=document.getElementById('leadStatus').value,source=document.getElementById('leadSource').value;document.getElementById('amountWrap').style.display=status==='Converted'?'block':'none';document.getElementById('followCountWrap').style.display=status==='Follow up'?'block':'none';document.getElementById('customSourceWrap').style.display=source==='Custom'?'block':'none';const ci=document.getElementById('leadCheckIn'),co=document.getElementById('leadCheckOut');if(ci&&co&&ci.value){const d=new Date(ci.value+'T00:00:00');d.setDate(d.getDate()+1);const min=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;co.min=min;if(!co.value||co.value<=ci.value)co.value=min}}
function openAdd(){modal(formHTML());bindForm(false);}
function openEdit(row){const r=state.leads.find(x=>+x._sheet_row===row);if(!r)return;modal(formHTML(r));bindForm(true,row);}
function bindForm(isEdit,row){document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelLead').onclick=closeModal;document.getElementById('leadStatus').onchange=syncForm;document.getElementById('leadSource').onchange=syncForm;document.getElementById('leadCheckIn').onchange=syncForm;syncForm();document.getElementById('saveLead').onclick=async()=>{const err=document.getElementById('formError');err.innerHTML='';const phone=document.getElementById('leadPhone').value.trim(),ci=document.getElementById('leadCheckIn').value,co=document.getElementById('leadCheckOut').value,status=document.getElementById('leadStatus').value,count=document.getElementById('leadFollowCount').value,last=document.getElementById('leadLastFollow').value;let source=document.getElementById('leadSource').value;if(source==='Custom')source=document.getElementById('customSource').value.trim();if(!phone){err.innerHTML='<div class="alert error">Phone number is required.</div>';return}if(ci&&co&&co<=ci){err.innerHTML='<div class="alert error">Check-out date must be after the check-in date.</div>';return}if(status==='Follow up'&&last&&!count){err.innerHTML='<div class="alert error">Please select the follow-up count.</div>';return}if(isEdit&&!source){err.innerHTML='<div class="alert error">Please enter a custom source.</div>';return}const lead={Date:displayDate(document.getElementById('leadDate').value),Name:document.getElementById('leadName').value.trim(),Number:phone,Email:document.getElementById('leadEmail').value.trim(),'Check In Date':displayDate(ci),'Check Out Date':displayDate(co),'Booking Confirmation Date':displayDate(document.getElementById('leadBooking').value),Agent:document.getElementById('leadAgent').value,Status:status,Source:source,'Last Follow Up':displayDate(last),'Follow Up Count':status==='Follow up'?count:'',Remarks:document.getElementById('leadRemarks').value.trim(),'Total Amount':status==='Converted'?amount(document.getElementById('leadAmount')?.value):''};try{if(isEdit)await api(`/api/leads/${row}`,{method:'PUT',body:JSON.stringify(lead)});else await api('/api/leads',{method:'POST',body:JSON.stringify(lead)});closeModal();await load();showToast(isEdit?'Lead updated successfully.':'Lead added successfully.','success')}catch(e){err.innerHTML=`<div class="alert error">${esc(e.message)}</div>`}}}
function openDelete(row){const r=state.leads.find(x=>+x._sheet_row===row);if(!r)return;modal(`<div class="modal-head"><div class="modal-title">🗑️ Delete Lead</div><button class="close" id="closeModal">✕</button></div><p>Are you sure you want to delete <b>${esc(r.Name||'Unnamed Lead')}</b>?</p><div class="alert warning">This action will permanently remove the lead from the Google Sheet.</div><div class="modal-actions"><button class="btn btn-danger" id="confirmDelete">🗑️ Yes, Delete Lead</button><button class="btn" id="cancelDelete">Cancel</button></div>`,'small');document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelDelete').onclick=closeModal;document.getElementById('confirmDelete').onclick=async()=>{try{await api(`/api/leads/${row}`,{method:'DELETE'});closeModal();await load();showToast('Lead deleted successfully.','success')}catch(e){showToast(e.message,'error')}}}
function openBulk(){modal(`<div class="modal-head"><div class="modal-title">📥 Bulk Add Leads</div><button class="close" id="closeModal">✕</button></div><p style="font-size:12px;color:#64748b">Upload Excel/CSV → validate → preview → add all new leads in one batch.</p><div class="modal-actions"><button class="btn" id="downloadTemplate">📄 Download Excel Template</button></div><div class="field" style="margin-top:12px"><label>Upload Excel or CSV</label><input id="bulkFile" type="file" accept=".xlsx,.xls,.csv"></div><div id="bulkResult"></div><div class="modal-actions"><button class="btn" id="bulkAdd" style="display:none">✅ Add New Leads</button><button class="btn" id="closeBulk">✖ Close Bulk Add</button></div>`);document.getElementById('closeModal').onclick=closeModal;document.getElementById('closeBulk').onclick=closeModal;document.getElementById('downloadTemplate').onclick=downloadTemplate;document.getElementById('bulkFile').onchange=handleBulkFile;}
function downloadTemplate(){const ws=XLSX.utils.json_to_sheet([{Date:'',Name:'',Number:'',Email:'','Check In Date':'','Check Out Date':'','Booking Confirmation Date':'',Agent:'',Status:'',Source:'','Last Follow Up':'','Follow Up Count':'',Remarks:'','Total Amount':''}]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Leads');XLSX.writeFile(wb,'lead_bulk_upload_template.xlsx');}
function cleanText(v){return v==null||String(v).toLowerCase()==='nan'?'':String(v).trim()}
function bulkDate(v){if(v==null||v==='')return null;if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return `${String(d.getUTCDate()).padStart(2,'0')}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${d.getUTCFullYear()}`}return displayDate(v)}
async function handleBulkFile(e){const file=e.target.files[0];if(!file)return;const result=document.getElementById('bulkResult');result.innerHTML='<div style="padding:15px;color:#64748b"><span class="spinner"></span> Reading file...</div>';try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});const aliases={DATE:'Date',NAME:'Name',NUMBER:'Number',PHONE:'Number','PHONE NUMBER':'Number',EMAIL:'Email','CHECK IN DATE':'Check In Date','CHECK OUT DATE':'Check Out Date','BOOKING CONFIRMATION DATE':'Booking Confirmation Date',AGENT:'Agent',STATUS:'Status',SOURCE:'Source','LAST FOLLOW UP':'Last Follow Up','LAST FOLLOW UP DONE ON':'Last Follow Up','FOLLOW UP COUNT':'Follow Up Count',REMARKS:'Remarks','TOTAL AMOUNT':'Total Amount'};const raw=rows.map(x=>{const o={};Object.entries(x).forEach(([k,v])=>o[aliases[String(k).trim().toUpperCase()]||String(k).trim()]=v);return o});const missing=['Date','Name','Number'].filter(x=>!raw.length||!(x in raw[0]));if(missing.length){result.innerHTML=`<div class="alert error">Missing required columns: ${missing.join(', ')}</div>`;return}const existing=new Set(state.leads.map(r=>normalizePhone(r.Number)).filter(Boolean)),seen=new Set(),valid=[],errors=[],dupes=[];raw.forEach((r,i)=>{const row=i+2,name=cleanText(r.Name),phone=normalizePhone(r.Number),status=cleanText(r.Status)||'Quotation Given',agent=cleanText(r.Agent),source=cleanText(r.Source),errs=[];if(!bulkDate(r.Date))errs.push('Date is required/invalid');if(!name)errs.push('Name is required');if(!phone)errs.push('Phone number is required/invalid');if(!STATUSES.includes(status))errs.push(`Invalid status: ${status}`);if(agent&&!AGENTS.includes(agent))errs.push(`Invalid agent: ${agent}`);if(source&&!SOURCES.includes(source))errs.push(`Invalid source: ${source}`);if(phone&&(existing.has(phone)||seen.has(phone))){dupes.push([row,phone,'Duplicate phone number']);return}if(errs.length){errors.push([row,errs.join('; ')]);return}valid.push({Date:bulkDate(r.Date),Name:name,Number:phone,Email:cleanText(r.Email),'Check In Date':bulkDate(r['Check In Date']),'Check Out Date':bulkDate(r['Check Out Date']),'Booking Confirmation Date':bulkDate(r['Booking Confirmation Date']),Agent:agent,Status:status,Source:source,'Last Follow Up':bulkDate(r['Last Follow Up']),'Follow Up Count':cleanText(r['Follow Up Count']),Remarks:cleanText(r.Remarks),'Total Amount':status==='Converted'?cleanText(r['Total Amount']):''});seen.add(phone)});window._bulkValid=valid;result.innerHTML=`<div class="bulk-summary"><b>Rows:</b> ${raw.length} &nbsp;|&nbsp; <b>New:</b> ${valid.length} &nbsp;|&nbsp; <b>Duplicates:</b> ${dupes.length} &nbsp;|&nbsp; <b>Invalid:</b> ${errors.length}</div>${dupes.length?`<details><summary>⚠️ Duplicates (${dupes.length})</summary>${smallTable(['Excel Row','Phone','Reason'],dupes)}</details>`:''}${errors.length?`<details><summary>❌ Invalid rows (${errors.length})</summary>${smallTable(['Excel Row','Reason'],errors)}</details>`:''}${valid.length?`<h4>Preview new leads</h4>${smallTable(['Date','Name','Number','Email','Agent','Status','Source'],valid.map(x=>[x.Date,x.Name,x.Number,x.Email,x.Agent,x.Status,x.Source]))}`:''}`;const b=document.getElementById('bulkAdd');b.style.display=valid.length?'block':'none';b.textContent=`✅ Add ${valid.length} New Leads`;b.onclick=async()=>{try{const d=await api('/api/leads/bulk',{method:'POST',body:JSON.stringify({leads:window._bulkValid})});closeModal();await load();showToast(`${d.count} leads added successfully.`,'success')}catch(e){result.insertAdjacentHTML('afterbegin',`<div class="alert error">${esc(e.message)}</div>`)}}}catch(e){result.innerHTML=`<div class="alert error">Could not read the file: ${esc(e.message)}</div>`}}
function smallTable(head,rows){return `<div class="table-scroll"><table class="preview-table"><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,100).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
load();
</script>
</body>
</html>
